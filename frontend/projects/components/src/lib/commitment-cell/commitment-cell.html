<div class="cell">
  <button
    type="button"
    class="ring-wrap"
    aria-label="Log today"
    (click)="toggle.emit()"
    [attr.data-testid]="testIdFor('toggle')"
  >
    <bq-ring
      [value]="done() ? 1 : value()"
      [size]="44"
      [stroke]="2.4"
      [accented]="done()"
    />
    @if (done()) {
      <span class="check">
        <bq-icon name="check" [size]="14" [stroke]="1.6" />
      </span>
    }
  </button>
  <button type="button" class="text" (click)="open.emit()">
    <span class="title">{{ title() }}</span>
    <span class="meta" [attr.data-testid]="testIdFor('streak')">
      {{ streak() }}-day streak · {{ cadence() }}
    </span>
  </button>
</div>
