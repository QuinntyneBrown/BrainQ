<div class="tweaks">
  <bq-icon-button
    ariaLabel="Tweaks"
    (click)="toggle()"
    data-testid="tweaks-toggle"
    class="tweaks-cog"
  >
    <bq-icon name="settings" [size]="20" [stroke]="1.4" />
  </bq-icon-button>

  @if (open()) {
    <div class="tweaks-panel" role="dialog" aria-label="Tweaks">
      <section class="row">
        <span class="bq-meta bq-meta-dim">Theme</span>
        <div class="seg">
          @for (t of themes; track t) {
            <button
              type="button"
              class="seg-btn"
              [class.active]="theme() === t"
              (click)="setTheme(t)"
              [attr.aria-pressed]="theme() === t"
              [attr.data-testid]="'tweaks-theme-' + t"
            >
              {{ t }}
            </button>
          }
        </div>
      </section>

      <section class="row">
        <span class="bq-meta bq-meta-dim">Accent</span>
        <div class="swatches">
          @for (a of accents; track a) {
            <button
              type="button"
              class="swatch"
              [class.active]="accent() === a"
              [class]="'swatch swatch-' + a"
              [class.is-active]="accent() === a"
              (click)="setAccent(a)"
              [attr.aria-pressed]="accent() === a"
              [attr.aria-label]="a"
              [attr.data-testid]="'tweaks-accent-' + a"
            ></button>
          }
        </div>
      </section>

      <section class="row">
        <span class="bq-meta bq-meta-dim">Density</span>
        <div class="seg">
          @for (d of densities; track d) {
            <button
              type="button"
              class="seg-btn"
              [class.active]="density() === d"
              (click)="setDensity(d)"
              [attr.aria-pressed]="density() === d"
              [attr.data-testid]="'tweaks-density-' + d"
            >
              {{ d }}
            </button>
          }
        </div>
      </section>
    </div>
  }
</div>
