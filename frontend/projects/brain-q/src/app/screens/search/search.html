<div class="screen">
  <header class="head">
    <span class="bq-meta bq-meta-dim">SEARCH</span>
    <h1 class="bq-display-sm">Find anything you’ve thought about.</h1>
  </header>

  <bq-search-bar
    size="lg"
    [value]="query()"
    (valueChange)="query.set($event)"
    [placeholder]="placeholder()"
    [autofocus]="true"
    data-testid="search-input"
  />

  <div class="chip-row">
    <bq-chip
      [active]="mode() === 'structured'"
      (click)="setMode('structured')"
      [attr.aria-pressed]="mode() === 'structured'"
      data-testid="search-mode-structured"
      >structured</bq-chip
    >
    <bq-chip
      [active]="mode() === 'semantic'"
      (click)="setMode('semantic')"
      [attr.aria-pressed]="mode() === 'semantic'"
      data-testid="search-mode-semantic"
      >semantic</bq-chip
    >
    <span class="hint"><span class="bq-meta bq-meta-dim">{{ hint() }}</span></span>
  </div>

  @if (!query().trim()) {
    <section class="block">
      <bq-section-label>Try</bq-section-label>
      <div class="suggestion-list">
        @for (s of suggestions; track s; let i = $index) {
          <bq-suggestion (select)="pickSuggestion(s)" [attr.data-testid]="'search-suggestion-' + i">
            {{ s }}
          </bq-suggestion>
        }
      </div>
    </section>
  } @else {
    <section class="block" data-testid="search-results">
      <bq-section-label [count]="results().length" data-testid="search-results-label">
        {{ resultsLabel() }}
      </bq-section-label>
      <div class="rows">
        @for (e of results(); track e.id) {
          <bq-entity-row
            [type]="e.type"
            [title]="e.title"
            [subtitle]="e.subtitle"
            (open)="requestOpen(e.id)"
            [attr.data-testid]="'brain-row-' + e.id"
          />
        }
        @if (!results().length) {
          <div class="empty"><span class="bq-meta bq-meta-dim">Nothing yet. Try different words.</span></div>
        }
      </div>
    </section>
  }
</div>
