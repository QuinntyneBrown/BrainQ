<bq-sheet [open]="open()" (close)="closed.emit()">
  <div class="head">
    <span class="bq-meta bq-meta-dim">CAPTURE</span>
    <bq-icon-button ariaLabel="Close" (click)="closed.emit()">
      <bq-icon name="close" [size]="18" [stroke]="1.4" />
    </bq-icon-button>
  </div>

  <textarea
    #textarea
    class="capture-input"
    [value]="text()"
    (input)="onTextInput($event)"
    placeholder="What’s on your mind?"
    rows="4"
  ></textarea>

  <div class="capture-meta">
    <span class="bq-meta bq-meta-dim">Detected as</span>
    <span class="detected">
      <bq-type-glyph [type]="finalType()" [size]="12" />
      <span>{{ typeLabel[finalType()] }}</span>
    </span>
  </div>

  <div class="chip-row">
    <bq-chip [active]="typeChoice() === 'auto'" (click)="setType('auto')">auto</bq-chip>
    @for (t of types; track t) {
      <bq-chip [active]="typeChoice() === t" [glyph]="t" (click)="setType(t)">
        {{ typeLabel[t] }}
      </bq-chip>
    }
  </div>

  @if (suggested().length) {
    <div class="suggested">
      <span class="bq-meta bq-meta-dim">Looks related to</span>
      <div class="suggested-list">
        @for (s of suggested(); track s.id) {
          <bq-edge-chip [targetType]="s.type" [targetTitle]="s.title" [isStatic]="true" />
        }
      </div>
    </div>
  }

  <div class="actions">
    <bq-button variant="ghost" (click)="cancel()">Cancel</bq-button>
    <bq-button variant="primary" [disabled]="!text().trim()" (click)="save()">
      <span>Save to brain</span>
      <bq-icon name="arrow" [size]="14" [stroke]="1.6" />
    </bq-button>
  </div>
</bq-sheet>
