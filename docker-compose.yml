services:
  db:
    image: pgvector/pgvector:pg17
    container_name: brainq-db
    environment:
      POSTGRES_DB: brainq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - brainq-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brainq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brainq-db-data:
